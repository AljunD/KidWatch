openapi: 3.0.3
info:
  title: KidWatch API
  version: 1.0.0
  description: >
    OpenAPI specification for KidWatch backend.  
    All endpoints return standardized success/error responses.

servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          description: Response payload
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error
        errors:
          type: array
          items:
            type: string

paths:
  /login:
    post:
      tags: [Auth]
      summary: Guardian login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Guardian logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /students:
    get:
      tags: [Students]
      summary: List students
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Students retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /students/{student}:
    get:
      tags: [Students]
      summary: Get student details
      parameters:
        - name: student
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /students/{student}/progress:
    get:
      tags: [Progress]
      summary: Get student progress
      parameters:
        - name: student
          in: path
          required: true
          schema:
            type: integer
        - name: week
          in: query
          required: false
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Progress records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /students/{student}/weeks/{week}/summary:
    get:
      tags: [Summaries]
      summary: Get weekly summary
      parameters:
        - name: student
          in: path
          required: true
          schema:
            type: integer
        - name: week
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Weekly summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Summary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
